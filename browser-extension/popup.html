<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PinboardShot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="panel" class="panel" data-state="idle" data-connection="checking">
    <header class="brand-header">
      <div class="brand-lockup">
        <img class="brand-icon" src="icons/icon128.png" alt="" aria-hidden="true">
        <strong>PinboardShot</strong>
      </div>
      <button id="language" class="language-button" type="button">EN</button>
    </header>
    <p id="connection" class="connection" role="status" aria-live="polite"></p>

    <section class="hero" aria-labelledby="title">
      <div class="hero-copy">
        <span id="statusBadge" class="sr-only" hidden></span>
        <h1 id="title"></h1>
        <p id="description" class="description"></p>
      </div>
      <div class="capture-scene" aria-hidden="true">
        <div class="scene-canvas">
          <img class="scene-image" src="icons/capture-scene.png" alt="">
          <span class="scanline"></span>
        </div>
        <span id="sceneBadge" class="scene-badge" hidden><span class="scene-symbol"></span></span>
      </div>
    </section>

    <section id="captureCard" class="capture-card" aria-busy="false">
      <h2 id="resultTitle" class="result-title" hidden></h2>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <button id="start" class="primary" type="button"><span id="startLabel"></span><span class="button-tail" aria-hidden="true"><span class="button-symbol"></span></span></button>
      <label id="saveOptions" class="save-options" hidden><input id="saveAs" type="checkbox"><span id="saveAsLabel"></span></label>

      <div id="progressArea" class="progress-area" hidden>
        <div class="progress-heading">
          <p id="progressText" role="status" aria-live="polite"></p>
          <span id="progressPercent" class="progress-percent" hidden></span>
        </div>
        <div id="progressTrack" class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-labelledby="progressText">
          <div id="progressBar"></div>
        </div>
        <div id="captureActions" class="capture-actions">
          <button id="pause" class="primary pause-button" type="button"><span id="pauseLabel"></span><span class="button-tail" aria-hidden="true"><span class="button-symbol"></span></span></button>
          <button id="stop" class="stop-button" type="button"><span class="stop-symbol" aria-hidden="true"></span><span id="stopLabel"></span></button>
          <button id="cancel" class="cancel-button" type="button"></button>
        </div>
        <p id="finishHint" class="finish-hint" hidden></p>
      </div>
    </section>

    <footer class="panel-footer">
      <small id="shortcut"></small>
    </footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
